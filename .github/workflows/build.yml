name: Build VirtualCam APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:      # lets you trigger manually from the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Get the code ───────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java 17 (required by AGP 8.x) ─────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Gradle 8.5 ────────────────────────────────────────────────────
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      # ── 4. Accept Android SDK licences + install API 34 ──────────────────
      - name: Prepare Android SDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # ── 5. Build ──────────────────────────────────────────────────────────
      - name: Build debug APK
        run: gradle assembleDebug

      # ── 6. Upload APK as a downloadable artifact ──────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCam-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
